name: open-tickets

on:
  pull_request:
    paths: ['plugins/open-tickets/**', '.github/workflows/open-tickets.yml']
  push:
    branches: [main]
    paths: ['plugins/open-tickets/**', '.github/workflows/open-tickets.yml']

defaults:
  run:
    working-directory: plugins/open-tickets

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Unit tests
        run: python3 -m pytest tests -q
