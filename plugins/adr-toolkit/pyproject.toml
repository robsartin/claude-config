[project]
name = "adr-toolkit"
version = "0.1.0"
description = "Composable ADR toolkit: emit a stack-appropriate docs/adr/ into a repo"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
adr-toolkit = "adr_toolkit.cli:main"
adr-supersede = "adr_toolkit.supersede_cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "coverage>=7", "mypy>=1.11", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adr_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src", "scripts", "tests"]

[tool.coverage.run]
source = ["adr_toolkit"]
branch = true

[tool.coverage.report]
# The U5 gate lives in scripts/check_coverage.py, which owns both thresholds
# (fail_under is a single blended number and cannot express line AND branch).
# The Python pack may tighten them.
show_missing = true
